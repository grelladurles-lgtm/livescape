services:
  - type: web
    name: livescape
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: livescape-db
          property: connectionString

databases:
  - name: livescape-db
    databaseName: livescape
    user: livescape
